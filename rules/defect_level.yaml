# 缺陷分级判定关键词（基于 Q/GDW 745-2012 三级定义）
# 匹配顺序：危急 → 一般 → 严重（命中即返回）；未命中走缺陷库匹配兜底
#
# v1.1 收紧（2026-10）：仅保留在缺陷库 5964 条黄金标注上精确率 = 100% 的关键词。
# 宽泛词（明显/破损/超标/发热/沉降/爬电/放电/击穿…）不结合程度/部位无法单独定级，
# 已从关键词移除，改由缺陷库匹配兜底（0 误判），避免"一般"被误判成"严重/危急"。
version: "1.1"

keywords:
  危急:
    - 烧损
    - 烧毁
    - 闪络
    - 冒烟
    - 起火
    - 爆炸
    - 严重漏油
    - 严重发热
    - 严重过热
    - 拒分
    - 误动
    - 随时可能
    - 立即停运
    - 立即处理
  严重: []
  一般:
    - 轻微
