<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电网智能运维助手 · 控制台</title>
<style>
  :root { color-scheme: light; --bg:#f7f8fa; --surface:#fff; --muted:#5d6b7a; --text:#17202a; --border:#d9e0e7; --accent:#2563eb; --success:#16803c; --warning:#b7791f; --danger:#c2410c; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); height: 100vh; font-size: 14px; }

  /* 登录 */
  .login-view { display:flex; align-items:center; justify-content:center; height:100vh; background:linear-gradient(135deg,#0f2440,#16324f); }
  .login-card { width:340px; background:#fff; border-radius:12px; padding:34px 30px; box-shadow:0 18px 46px rgba(0,0,0,.3); }
  .login-card h1 { font-size:17px; margin-bottom:4px; text-align:center; }
  .login-card .sub { font-size:12px; color:var(--muted); text-align:center; margin-bottom:22px; }
  .login-card input { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:6px; font-size:14px; margin-bottom:12px; }
  .login-card button { width:100%; padding:10px; background:var(--accent); color:#fff; border:none; border-radius:6px; font-size:14px; cursor:pointer; }
  .login-card .hint { font-size:12px; color:var(--muted); text-align:center; margin-top:12px; }

  /* 控制台布局 */
  .app { display:flex; height:100vh; }
  .sidebar { width:220px; background:#0f2440; color:#c8d4e4; display:flex; flex-direction:column; }
  .sidebar .logo { padding:16px 18px; font-size:14px; font-weight:600; color:#fff; border-bottom:1px solid #1c3554; }
  .nav { flex:1; padding:10px 8px; }
  .nav-item { padding:10px 12px; border-radius:6px; cursor:pointer; margin-bottom:3px; font-size:13px; color:#c8d4e4; }
  .nav-item:hover { background:#1c3554; }
  .nav-item.active { background:var(--accent); color:#fff; }
  .sidebar .user { padding:12px 16px; border-top:1px solid #1c3554; font-size:12px; display:flex; align-items:center; gap:8px; }
  .sidebar .user .role { background:var(--accent); border-radius:4px; padding:1px 7px; font-size:11px; color:#fff; }
  .sidebar .user button { margin-left:auto; background:none; border:1px solid #3a5a7e; color:#c8d4e4; border-radius:5px; padding:3px 8px; font-size:11px; cursor:pointer; }

  .content { flex:1; overflow-y:auto; padding:20px 24px; }
  .view { display:none; }
  .view.active { display:block; }
  .page-title { font-size:18px; font-weight:600; margin-bottom:14px; }
  .panel { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:16px; margin-bottom:14px; }

  /* 表格 */
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { padding:9px 12px; border-bottom:1px solid var(--border); text-align:left; vertical-align:top; }
  th { color:var(--muted); font-weight:600; background:#fafbfc; }
  .badge { display:inline-block; border-radius:4px; padding:1px 8px; font-size:12px; }
  .badge.ok { background:#e6f4ea; color:var(--success); }
  .badge.warn { background:#fef3e2; color:var(--warning); }
  .badge.down { background:#fce8e6; color:var(--danger); }
  .badge.active { background:#e8f0fe; color:var(--accent); }
  .badge.super { background:#f3e8fd; color:#7c3aed; }
  .mono { font-family: Consolas, "SFMono-Regular", monospace; font-size:12px; }

  /* 聊天 */
  .chat-wrap { display:flex; gap:14px; height:calc(100vh - 140px); }
  .chat-main { flex:1; display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--border); border-radius:8px; }
  .messages { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:80%; padding:9px 13px; border-radius:8px; line-height:1.6; white-space:pre-wrap; word-break:break-word; font-size:14px; }
  .msg.user { align-self:flex-end; background:var(--accent); color:#fff; }
  .msg.assistant { align-self:flex-start; background:#f1f4f7; }
  .msg.sys { align-self:center; color:var(--muted); font-size:12px; }
  .sources { margin-top:6px; font-size:12px; color:var(--muted); border-top:1px dashed var(--border); padding-top:5px; }
  .input-bar { display:flex; gap:8px; padding:12px; border-top:1px solid var(--border); }
  .input-bar input { flex:1; padding:10px 13px; border:1px solid var(--border); border-radius:6px; font-size:14px; }
  .input-bar button { padding:0 16px; background:var(--accent); color:#fff; border:none; border-radius:6px; cursor:pointer; font-size:14px; }
  #device-btn { background:#fff; color:var(--accent); border:1px solid var(--accent); }
  .device-tag { display:inline-block; background:#e8f0fe; color:var(--accent); border-radius:4px; padding:2px 8px; font-size:12px; margin-left:8px; }
  .device-picker { position:absolute; bottom:64px; left:24px; right:24px; max-height:300px; background:#fff; border:1px solid var(--border); border-radius:8px; box-shadow:0 10px 30px rgba(0,0,0,.12); display:none; flex-direction:column; }
  .device-picker input { margin:10px; padding:8px 12px; border:1px solid var(--border); border-radius:6px; }
  .device-list { overflow-y:auto; }
  .device-item { padding:8px 14px; font-size:13px; cursor:pointer; display:flex; justify-content:space-between; border-top:1px solid #f0f2f5; }
  .device-item:hover { background:#e8f0fe; }
  .confirm-box { background:#fff8e6; border:1px solid #f0d68a; border-radius:8px; padding:10px 12px; margin-top:6px; }
  .confirm-box .preview { font-size:12px; color:#6b5b1d; margin-bottom:6px; white-space:pre-wrap; }
  .confirm-box button { padding:5px 12px; border-radius:5px; border:none; font-size:12px; cursor:pointer; margin-right:6px; }
  .confirm-box .ok { background:var(--accent); color:#fff; }

  /* trace 时间线 */
  .trace-step { border-left:2px solid var(--border); padding:0 0 14px 16px; position:relative; }
  .trace-step:before { content:''; position:absolute; left:-6px; top:2px; width:10px; height:10px; border-radius:50%; background:var(--accent); }
  .trace-step .step-head { font-size:13px; font-weight:600; display:flex; gap:8px; align-items:center; }
  .trace-step .step-meta { font-size:12px; color:var(--muted); margin-top:3px; }
  .trace-step pre { background:#f7f8fa; border-radius:6px; padding:8px; font-size:12px; overflow-x:auto; margin-top:6px; }

  /* 健康卡片 */
  .health-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; }
  .health-card { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:14px; }
  .health-card .name { font-size:13px; font-weight:600; }
  .health-card .status { margin-top:6px; }
  .health-card .latency { font-size:12px; color:var(--muted); margin-top:4px; }

  input.search, textarea { width:100%; padding:9px 12px; border:1px solid var(--border); border-radius:6px; font-size:14px; }
  .hint { font-size:12px; color:var(--muted); }
</style>
</head>
<body>

<div id="login-view" class="login-view">
  <div class="login-card">
    <h1>⚡ 电网智能运维助手</h1>
    <div class="sub">智能问答 · 缺陷诊断 · 工单管理</div>
    <input id="username" placeholder="用户名" value="admin">
    <input id="password" type="password" placeholder="密码" value="admin123">
    <button onclick="doLogin()">登 录</button>
    <div class="hint">默认 admin / admin123</div>
  </div>
</div>

<div id="app" class="app" style="display:none">
  <aside class="sidebar">
    <div class="logo">⚡ 电网智能运维助手</div>
    <nav class="nav">
      <div class="nav-item active" data-v="chat" onclick="switchView('chat')">💬 对话工作台</div>
      <div class="nav-item" data-v="trace" onclick="switchView('trace')">🔍 运行链路</div>
      <div class="nav-item" data-v="tools" onclick="switchView('tools')">🔧 工具注册</div>
      <div class="nav-item" data-v="knowledge" onclick="switchView('knowledge')">📚 知识库</div>
      <div class="nav-item" data-v="cases" onclick="switchView('cases')">🧠 复盘案例</div>
      <div class="nav-item" data-v="health" onclick="switchView('health')">🩺 系统健康</div>
    </nav>
    <div class="user">
      <span id="user-name">-</span><span class="role" id="user-role">-</span>
      <button onclick="logout()">退出</button>
    </div>
  </aside>

  <section class="content">
    <!-- 对话工作台 -->
    <div id="view-chat" class="view active">
      <div class="page-title">对话工作台 <span class="device-tag" id="device-tag" style="display:none"></span></div>
      <div class="chat-wrap">
        <div class="chat-main">
          <div class="messages" id="chat"></div>
          <div class="input-bar" style="position:relative">
            <button id="device-btn" onclick="toggleDevicePicker()">📋 设备</button>
            <input id="input" placeholder="输入问题，回车发送..." onkeydown="if(event.key==='Enter')send()">
            <button onclick="send()">发送</button>
            <div class="device-picker" id="device-picker">
              <input id="device-search" placeholder="搜索设备名称/站所/类型..." oninput="loadDevices()">
              <div class="device-list" id="device-list"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 运行链路 -->
    <div id="view-trace" class="view">
      <div class="page-title">运行链路</div>
      <div class="panel">
        <input class="search" id="trace-input" placeholder="输入 session_id（如 sxxxx），查看该会话的完整调用链路">
        <button style="margin-top:8px;padding:8px 16px;background:var(--accent);color:#fff;border:none;border-radius:6px;cursor:pointer" onclick="loadTrace()">查询</button>
        <div class="hint" style="margin-top:6px">提示：需要 admin 权限。会话列表在下方，点会话 ID 可填入。</div>
      </div>
      <div class="panel" id="trace-sessions"></div>
      <div class="panel" id="trace-result"><div class="hint">输入 session_id 查询运行链路</div></div>
    </div>

    <!-- 工具注册 -->
    <div id="view-tools" class="view">
      <div class="page-title">工具注册</div>
      <div class="panel" id="tools-panel"><div class="hint">加载中...</div></div>
    </div>

    <!-- 知识库 -->
    <div id="view-knowledge" class="view">
      <div class="page-title">知识库</div>
      <div class="panel">
        <input class="search" id="kb-query" placeholder="检索知识库...（如：危急缺陷消缺时限）">
        <button style="margin-top:8px;padding:8px 16px;background:var(--accent);color:#fff;border:none;border-radius:6px;cursor:pointer" onclick="searchKB()">检索</button>
        <div id="kb-result" style="margin-top:10px"></div>
      </div>
      <div class="panel" id="kb-docs"><div class="hint">加载中...</div></div>
    </div>

    <!-- 复盘案例 -->
    <div id="view-cases" class="view">
      <div class="page-title">复盘案例库 <span class="hint" style="font-weight:400">（已审核案例会被 Agent 诊断时检索；审核需 manager/admin）</span></div>
      <div class="panel">
        <input class="search" id="case-query" placeholder="检索案例（现象/根因关键词，如：温度 过热）...">
        <button style="margin-top:8px;padding:8px 16px;background:var(--accent);color:#fff;border:none;border-radius:6px;cursor:pointer" onclick="searchCases()">检索</button>
        <button style="margin-top:8px;margin-left:8px;padding:8px 16px;background:#fff;color:var(--accent);border:1px solid var(--accent);border-radius:6px;cursor:pointer" onclick="loadCases()">刷新全部</button>
        <div id="case-result" style="margin-top:10px"><div class="hint">加载中...</div></div>
      </div>
    </div>

    <!-- 系统健康 -->
    <div id="view-health" class="view">
      <div class="page-title">系统健康</div>
      <div class="health-grid" id="health-grid"><div class="hint">加载中...</div></div>
    </div>
  </section>
</div>

<script>
  const API = 'http://localhost:8000/api/v1';
  let token = null, currentSession = null, currentDevice = null, currentRole = '';
  function authHeaders() { return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }; }

  async function doLogin() {
    try {
      const res = await fetch(API + '/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ username:document.getElementById('username').value.trim(), password:document.getElementById('password').value.trim() }) });
      const json = await res.json();
      if (json.code !== 0) { alert('登录失败：' + (json.detail || '账号密码错误')); return; }
      token = json.data.token;
      document.getElementById('login-view').style.display = 'none';
      document.getElementById('app').style.display = 'flex';
      document.getElementById('user-name').textContent = json.data.user_id;
      document.getElementById('user-role').textContent = json.data.role;
      currentRole = json.data.role;
      loadTools(); loadDocs(); loadHealth();
      newChat();
    } catch (e) { alert('登录失败：' + e.message); }
  }
  function logout() { token = null; document.getElementById('app').style.display='none'; document.getElementById('login-view').style.display='flex'; }

  function switchView(name) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById('view-' + name).classList.add('active');
    document.querySelector('.nav-item[data-v="' + name + '"]').classList.add('active');
    if (name === 'trace') loadSessions();
    if (name === 'cases') loadCases();
  }

  // ---- 聊天 ----
  function sessionKey(id){ return 'gridops_chat_' + id; }
  function sessionsList(){ return JSON.parse(localStorage.getItem('gridops_sessions') || '[]'); }
  function saveSessions(l){ localStorage.setItem('gridops_sessions', JSON.stringify(l)); }
  function newChat(){ currentSession=null; currentDevice=null; document.getElementById('device-tag').style.display='none'; document.getElementById('chat').innerHTML='<div class="msg sys">新会话就绪，选择设备或直接提问</div>'; }
  function appendMsg(role,text,sources){ const box=document.getElementById('chat'); const d=document.createElement('div'); d.className='msg '+role; d.textContent=text; if(sources&&sources.length){ const s=document.createElement('div'); s.className='sources'; s.textContent='📎 '+sources.join('；'); d.appendChild(s);} box.appendChild(d); box.scrollTop=box.scrollHeight; if(currentSession){ const msgs=JSON.parse(localStorage.getItem(sessionKey(currentSession))||'[]'); msgs.push({role,text,sources}); localStorage.setItem(sessionKey(currentSession),JSON.stringify(msgs)); } }
  function appendSys(text){ const box=document.getElementById('chat'); const d=document.createElement('div'); d.className='msg sys'; d.textContent=text; box.appendChild(d); box.scrollTop=box.scrollHeight; }

  function toggleDevicePicker(){ const p=document.getElementById('device-picker'); p.style.display = p.style.display==='flex'?'none':'flex'; if(p.style.display==='flex') loadDevices(); }
  async function loadDevices(){ try{ const res=await fetch(API+'/devices?keyword='+encodeURIComponent(document.getElementById('device-search').value.trim())+'&limit=50',{headers:authHeaders()}); const json=await res.json(); const l=document.getElementById('device-list'); l.innerHTML=''; (json.data.devices||[]).forEach(dev=>{ const d=document.createElement('div'); d.className='device-item'; d.innerHTML='<span>'+dev.device_name+' <span class="mono">'+dev.device_type+' · '+dev.station+'</span></span><span class="mono">'+dev.device_id+'</span>'; d.onclick=()=>pickDevice(dev); l.appendChild(d); }); }catch(e){} }
  function pickDevice(dev){ currentDevice=dev; const tag=document.getElementById('device-tag'); tag.textContent='📍 '+dev.device_name+' ('+dev.device_id+')'; tag.style.display='inline-block'; document.getElementById('device-picker').style.display='none'; }

  async function send(){ const input=document.getElementById('input'); let text=input.value.trim(); if(!text) return; input.value=''; if(currentDevice && !/DEV\d+/.test(text)) text='设备 '+currentDevice.device_id+'：'+text; appendMsg('user',text); await handle(text); }

  function handleEvent(evt){ if(evt.type==='session'){ currentSession=evt.session_id; const l=sessionsList(); if(!l.find(s=>s.id===currentSession)){ l.unshift({id:currentSession,title:'会话 '+currentSession.slice(0,6)}); saveSessions(l);} } else if(evt.type==='intent'){ appendSys('🔍 '+evt.intent+'（置信 '+Math.round(evt.confidence*100)+'%）'); } else if(evt.type==='tool_call'){ appendSys('🔧 调用 '+evt.tool+' ...'); } else if(evt.type==='degraded'){ appendSys('⚠️ '+(evt.reason||'建议人工复核')); } else if(evt.type==='clarify'){ appendMsg('assistant',evt.question); } else if(evt.type==='confirm_required'){ showConfirm(evt); } else if(evt.type==='final_answer'){ appendMsg('assistant',evt.answer,evt.sources); } }

  async function handle(text){ if(!currentSession){ currentSession='s'+Date.now().toString(36); const l=sessionsList(); l.unshift({id:currentSession,title:'会话 '+currentSession.slice(0,6)}); saveSessions(l);} try{ const res=await fetch(API+'/chat/stream',{method:'POST',headers:authHeaders(),body:JSON.stringify({message:text,session_id:currentSession})}); if(res.status===401){ logout(); return; } const reader=res.body.getReader(); const dec=new TextDecoder(); let buf=''; while(true){ const {done,value}=await reader.read(); if(done) break; buf+=dec.decode(value,{stream:true}); let i; while((i=buf.indexOf('\n\n'))!==-1){ const c=buf.slice(0,i); buf=buf.slice(i+2); const line=c.split('\n').find(l=>l.startsWith('data: ')); if(line){ try{ handleEvent(JSON.parse(line.slice(6))); }catch(e){} } } } }catch(e){ appendSys('请求失败：'+e.message); } }

  function showConfirm(data){ const box=document.getElementById('chat'); const d=document.createElement('div'); d.className='msg assistant'; d.innerHTML='<div class="confirm-box" id="confirm-box"><div class="preview">工单草稿（待确认）</div><div class="preview">'+(JSON.stringify(data.preview,null,2)).replace(/</g,'&lt;')+'</div><button class="ok" onclick="confirm(true)">确认落库</button><button onclick="confirm(false)">取消</button></div>'; box.appendChild(d); box.scrollTop=box.scrollHeight; }
  async function confirm(ok){ document.getElementById('confirm-box').remove(); appendMsg('user',ok?'确认':'取消'); await handle(ok?'确认':'取消'); }

  // ---- 运行链路 ----
  async function loadSessions(){ try{ const res=await fetch(API+'/traces',{headers:authHeaders()}); }catch(e){ document.getElementById('trace-sessions').innerHTML='<div class="hint">本地会话（浏览器）</div>'; } const l=sessionsList(); document.getElementById('trace-sessions').innerHTML='<div class="hint" style="margin-bottom:8px">本地会话（点 ID 填入查询框）</div>'+l.map(s=>'<span class="mono" style="cursor:pointer;margin-right:12px" onclick="document.getElementById(\'trace-input\').value=\''+s.id+'\'">'+s.id+'</span>').join(''); }
  async function loadTrace(){ const sid=document.getElementById('trace-input').value.trim(); if(!sid) return; try{ const res=await fetch(API+'/traces/'+sid,{headers:authHeaders()}); if(res.status===403){ document.getElementById('trace-result').innerHTML='<div class="hint" style="color:var(--danger)">需要 admin 权限查看运行链路</div>'; return; } const json=await res.json(); const traces=json.data.traces||[]; document.getElementById('trace-result').innerHTML='<div class="hint" style="margin-bottom:10px">'+traces.length+' 个步骤</div>'+traces.map(t=>'<div class="trace-step"><div class="step-head">步骤 '+t.step+' · <span class="mono">'+t.tool+'</span> <span class="badge '+(t.degraded?'warn':'ok')+'">'+(t.degraded?'降级':'正常')+'</span> <span class="step-meta">'+t.elapsed_ms+'ms</span></div><div class="step-meta">参数：'+JSON.stringify(t.params)+'</div><div class="step-meta">结果：'+JSON.stringify(t.result)+'</div>'+(t.sources&&t.sources.length?'<div class="step-meta">来源：'+t.sources.join('；')+'</div>':'')+'</div>').join(''); }catch(e){ document.getElementById('trace-result').innerHTML='<div class="hint" style="color:var(--danger)">查询失败：'+e.message+'</div>'; } }

  // ---- 工具注册 ----
  async function loadTools(){ try{ const res=await fetch(API+'/tools',{headers:authHeaders()}); const json=await res.json(); const ts=json.data.tools||[]; document.getElementById('tools-panel').innerHTML='<table><tr><th>工具</th><th>说明</th><th>参数</th><th>只读</th></tr>'+ts.map(t=>'<tr><td class="mono">'+t.name+'</td><td>'+t.description+'</td><td class="mono">'+JSON.stringify(t.params)+'</td><td><span class="badge '+(t.read_only?'ok':'warn')+'">'+(t.read_only?'只读':'写')+'</span></td></tr>').join('')+'</table>'; }catch(e){ document.getElementById('tools-panel').innerHTML='<div class="hint">加载失败</div>'; } }

  // ---- 知识库 ----
  async function loadDocs(){ try{ const res=await fetch(API+'/knowledge/docs',{headers:authHeaders()}); const json=await res.json(); const docs=json.data.docs||[]; document.getElementById('kb-docs').innerHTML='<div class="hint" style="margin-bottom:8px">'+docs.length+' 篇文档</div><table><tr><th>标题</th><th>来源</th><th>状态</th></tr>'+docs.map(d=>'<tr><td>'+d.title+'</td><td class="mono">'+d.source+'</td><td><span class="badge '+(d.status==='superseded'?'super':'active')+'">'+d.status+'</span></td></tr>').join('')+'</table>'; }catch(e){ document.getElementById('kb-docs').innerHTML='<div class="hint">加载失败</div>'; } }
  async function searchKB(){ const q=document.getElementById('kb-query').value.trim(); if(!q) return; const r=document.getElementById('kb-result'); r.innerHTML='<div class="hint">检索中...</div>'; try{ const res=await fetch(API+'/knowledge/search?question='+encodeURIComponent(q),{headers:authHeaders()}); const json=await res.json(); const chunks=json.data.chunks||[]; if(!chunks.length){ r.innerHTML='<div class="hint">未检索到依据</div>'; return; } r.innerHTML=chunks.map(c=>'<div style="border-bottom:1px solid var(--border);padding:8px 0"><div class="mono" style="color:var(--accent)">'+c.title+' · '+c.source+'</div><div>'+c.content.slice(0,120)+'...</div></div>').join(''); }catch(e){ r.innerHTML='<div class="hint" style="color:var(--danger)">检索失败</div>'; } }

  // ---- 复盘案例 ----
  async function loadCases(status){ let url = API + '/review-cases' + (status ? '?status=' + encodeURIComponent(status) : ''); try { const res = await fetch(url, {headers: authHeaders()}); const json = await res.json(); renderCases(json.data.cases || []); } catch(e) { document.getElementById('case-result').innerHTML = '<div class="hint" style="color:var(--danger)">加载失败</div>'; } }
  function renderCases(cases){ const r = document.getElementById('case-result'); if(!cases.length){ r.innerHTML = '<div class="hint">暂无案例（先在对话里确认一个工单，会自动沉淀草稿）</div>'; return; } const canReview = currentRole === 'manager' || currentRole === 'admin'; r.innerHTML = cases.map(c => { const sb = {'草稿':'warn','已审核':'ok','已驳回':'down','已废止':'super'}[c.status] || 'active'; let btns = ''; if(canReview && c.status === '草稿'){ btns = '<button style="padding:5px 12px;border-radius:5px;border:none;font-size:12px;cursor:pointer;margin-right:6px;background:var(--accent);color:#fff" onclick="reviewCase(\''+c.case_id+'\',\'approve\')">通过</button><button style="padding:5px 12px;border-radius:5px;border:none;font-size:12px;cursor:pointer;background:var(--danger);color:#fff" onclick="reviewCase(\''+c.case_id+'\',\'reject\')">驳回</button>'; } else if(canReview && c.status === '已审核'){ btns = '<button style="padding:5px 12px;border-radius:5px;border:none;font-size:12px;cursor:pointer;background:var(--muted);color:#fff" onclick="reviewCase(\''+c.case_id+'\',\'supersede\')">废止</button>'; } return '<div class="trace-step"><div class="step-head"><span class="mono">'+c.case_id+'</span> <span class="badge '+sb+'">'+c.status+'</span> <span>'+c.title+'</span></div><div class="step-meta">设备：'+c.device_type+' · 现象：'+c.symptom+'</div>' + (c.root_cause ? '<div class="step-meta">根因：'+c.root_cause+'</div>' : '') + (c.action ? '<div class="step-meta">处置：'+c.action+'</div>' : '<div class="step-meta">处置待人工补充</div>') + (c.superseded_by ? '<div class="step-meta">已被 '+c.superseded_by+' 废止</div>' : '') + '<div style="margin-top:6px">'+btns+'</div></div>'; }).join(''); }
  async function searchCases(){ const q = document.getElementById('case-query').value.trim(); if(!q){ loadCases(); return; } try { const res = await fetch(API + '/review-cases/search?q=' + encodeURIComponent(q), {headers: authHeaders()}); const json = await res.json(); renderCases(json.data.cases || []); } catch(e){ document.getElementById('case-result').innerHTML = '<div class="hint" style="color:var(--danger)">检索失败</div>'; } }
  async function reviewCase(id, action){ try { const res = await fetch(API + '/review-cases/' + id + '/' + action, {method:'POST', headers:authHeaders(), body:'{}'}); const json = await res.json(); if(json.code !== 0){ alert('操作失败：' + (json.detail || json.message)); } loadCases(); } catch(e){ alert('操作失败：' + e.message); } }

  // ---- 系统健康 ----
  async function loadHealth(){ try{ const res=await fetch(API+'/health'); const json=await res.json(); const deps=json.data.dependencies||{}; const names={postgres:'PostgreSQL',chromadb:'ChromaDB',redis:'Redis'}; document.getElementById('health-grid').innerHTML=Object.entries(deps).map(([k,v])=>'<div class="health-card"><div class="name">'+names[k]+'</div><div class="status"><span class="badge '+(v==='ok'?'ok':'down')+'">'+(v==='ok'?'healthy':'down')+'</span></div></div>').join(''); }catch(e){ document.getElementById('health-grid').innerHTML='<div class="hint">加载失败</div>'; } }
</script>
</body>
</html>
